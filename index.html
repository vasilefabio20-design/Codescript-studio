<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito Ufficiale & App</title>
  <!-- Libreria Supabase integrata direttamente via script CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 95%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
    button:hover { background-color: #218838; }
    .hidden { display: none !important; }
    #app-section { max-width: 800px; width: 90%; }

    /* Stili integrati per l'app Officina */
    .officina-container {
      background: #F5F6F3;
      color: #1A1D19;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      text-align: left;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #D9DCD4;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .officina-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #D9DCD4;
      background: #FFFFFF;
    }
    .officina-dots { display: flex; gap: 6px; }
    .officina-dots span { width: 9px; height: 9px; border-radius: 50%; background: #D9DCD4; }
    .officina-header h3 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; color: #1A1D19; }
    .officina-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #D9DCD4;
      background: #EBEDE8;
      color: #1A1D19;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      width: auto;
      margin-top: 0;
    }
    .officina-btn-run { background: #2F6F4E; color: #FFFFFF; border-color: #2F6F4E; }
    .officina-main { display: flex; flex-direction: column; }
    .officina-pane { display: flex; flex-direction: column; padding: 10px; }
    .officina-pane-editor { background: #15181A; }
    .officina-pane-label { font-size: 11px; font-weight: 600; text-transform: lowercase; color: #6E756B; margin-bottom: 5px; }
    textarea#code {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: none;
      background: transparent;
      color: #E8EAE4;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      box-sizing: border-box;
    }
    textarea#code:focus { outline: none; }
    iframe#preview { width: 100%; height: 200px; border: 1px solid #D9DCD4; border-radius: 6px; background: #FFFFFF; }
    #console { font-family: monospace; font-size: 12px; max-height: 100px; overflow-y: auto; background: #EBEDE8; padding: 8px; border-radius: 6px; margin-top: 8px; }
    .log-line { white-space: pre-wrap; word-break: break-word; }
    .log-error { color: #B3432B; }
    .log-empty { color: #5B6058; font-style: italic; }
  </style>
</head>
<body>

  <!-- SEZIONE AUTENTICAZIONE (Login / Registrazione) -->
  <div id="auth-section" class="card">
    <h2>Accedi o Registrati</h2>
    <input type="email" id="email" placeholder="Inserisci la tua Email" required>
    <input type="password" id="password" placeholder="Inserisci la Password" required>
    
    <button type="button" onclick="signUp()">Registrati</button>
    <button type="button" onclick="signIn()" style="background-color: #007bff;">Accedi</button>
    
    <p id="message" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- SEZIONE APP RISERVATA (Visibile solo dopo il Login) -->
  <div id="app-section" class="card hidden">
    <h2>Benvenuto nella tua App!</h2>
    <p>Sei autenticato correttamente.</p>
    
    <!-- CONTENITORE DELLA TUA APP (OFFICINA) -->
    <div id="my-custom-app">
      <div class="officina-container">
        <div class="officina-header">
          <div class="officina-dots"><span></span><span></span><span></span></div>
          <h3>Officina</h3>
          <button class="officina-btn" id="clearBtn" type="button">Pulisci</button>
          <button class="officina-btn officina-btn-run" id="runBtn" type="button">Esegui ▸</button>
        </div>
        <div class="officina-main">
          <div class="officina-pane officina-pane-editor">
            <div class="officina-pane-label">codice (html / css / js)</div>
            <textarea id="code" spellcheck="false" placeholder="Incolla qui il tuo codice..."></textarea>
          </div>
          <div class="officina-pane">
            <div class="officina-pane-label" style="color: #5B6058">anteprima</div>
            <iframe id="preview" title="Anteprima" sandbox="allow-scripts allow-modals"></iframe>
            <div class="officina-pane-label" style="color: #5B6058; margin-top: 8px;">console</div>
            <div id="console"><div class="log-line log-empty">Nessun output ancora — premi Esegui.</div></div>
          </div>
        </div>
      </div>
    </div>

    <br>
    <button type="button" onclick="signOut()" style="background-color: #dc3545;">Esci (Logout)</button>
  </div>

  <script>
    // Configurazione Supabase
    const SUPABASE_URL = 'https://ibvqfuerfmdyvvoxwevy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tNxw_O5gpkdfylUl8ClL9w_gHmGifJl';

    let supabaseClient = null;

    function initSupabase() {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        document.getElementById('message').innerText = "Errore nel caricamento della libreria. Verifica la connessione internet.";
      }
    }

    async function signUp() {
      if (!supabaseClient) initSupabase();
      if (!supabaseClient) return;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        document.getElementById('message').style.color = 'red';
        document.getElementById('message').innerText = 'Inserisci email e password.';
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        document.getElementById('message').style.color = 'red';
        document.getElementById('message').innerText = error.message;
      } else {
        document.getElementById('message').style.color = 'green';
        document.getElementById('message').innerText = 'Registrazione completata! Controlla la tua email o prova ad accedere.';
      }
    }

    async function signIn() {
      if (!supabaseClient) initSupabase();
      if (!supabaseClient) return;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        document.getElementById('message').style.color = 'red';
        document.getElementById('message').innerText = 'Inserisci email e password.';
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        document.getElementById('message').style.color = 'red';
        document.getElementById('message').innerText = error.message;
      } else {
        showApp();
      }
    }

    async function signOut() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
    }

    async function checkUser() {
      initSupabase();
      if (!supabaseClient) return;

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        showApp();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkUser();

      // Logica Editor Officina
      var codeEl = document.getElementById('code');
      var runBtn = document.getElementById('runBtn');
      var clearBtn = document.getElementById('clearBtn');
      var consoleEl = document.getElementById('console');
      var preview = document.getElementById('preview');

      try {
        var saved = localStorage.getItem('officina:lastCode');
        if (saved && codeEl) codeEl.value = saved;
      } catch (e) {}

      function logLine(text, kind) {
        var empty = consoleEl.querySelector('.log-empty');
        if (empty) empty.remove();
        var div = document.createElement('div');
        div.className = 'log-line' + (kind ? ' log-' + kind : '');
        div.textContent = text;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }

      function clearConsole() {
        consoleEl.innerHTML = '<div class="log-line log-empty">Nessun output ancora — premi Esegui.</div>';
      }

      window.addEventListener('message', function (ev) {
        var data = ev.data;
        if (!data || data.source !== 'officina') return;
        if (data.type === 'log') logLine(data.text, data.level === 'error' ? 'error' : (data.level === 'warn' ? 'error' : null));
        if (data.type === 'error') logLine('Errore: ' + data.text, 'error');
      });

      function buildDoc(userCode) {
        var bridge = [
          '<script>',
          '(function(){',
          '  function send(level, args){',
          '    try {',
          '      var text = Array.prototype.map.call(args, function(a){',
          '        if (typeof a === "object") { try { return JSON.stringify(a); } catch(e){ return String(a); } }',
          '        return String(a);',
          '      }).join(" ");',
          '      parent.postMessage({source:"officina", type:"log", level: level, text: text}, "*");',
          '    } catch(e) {}',
          '  }',
          '  ["log","warn","error","info"].forEach(function(level){',
          '    var orig = console[level];',
          '    console[level] = function(){ send(level, arguments); orig && orig.apply(console, arguments); };',
          '  });',
          '  window.addEventListener("error", function(e){',
          '    parent.postMessage({source:"officina", type:"error", text: e.message + " (riga " + e.lineno + ")"}, "*");',
          '  });',
          '  window.addEventListener("unhandledrejection", function(e){',
          '    parent.postMessage({source:"officina", type:"error", text: "Promise non gestita: " + e.reason}, "*");',
          '  });',
          '})();',
          '<\/script>'
        ].join('\n');

        return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + bridge + '</head><body>' + userCode + '</body></html>';
      }

      function run() {
        var code = codeEl.value;
        clearConsole();
        consoleEl.innerHTML = '';
        if (!code.trim()) {
          logLine('Scrivi o incolla del codice prima di eseguire.', 'error');
          return;
        }
        try {
          localStorage.setItem('officina:lastCode', code);
        } catch (e) {}
        preview.srcdoc = buildDoc(code);
      }

      if (runBtn) runBtn.addEventListener('click', run);
      if (clearBtn) {
        clearBtn.addEventListener('click', function () {
          codeEl.value = '';
          preview.srcdoc = '';
          clearConsole();
          try { localStorage.removeItem('officina:lastCode'); } catch (e) {}
          codeEl.focus();
        });
      }
    });
  </script>
</body>
</html>
