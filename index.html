<!DOCTYPE HTML>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Officina</title>
  <!-- CDN Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hidden { display: none !important; }
    
    #app-section {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px;
    }

    .officina-container {
      background: #15181A;
      color: #A1D199;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2A2E33;
      margin-top: 10px;
      margin-bottom: 10px;
      position: relative;
      width: 100%;
    }

    .officina-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #2A2E33;
      background: #1c2023;
      flex-wrap: wrap;
      gap: 8px;
    }

    .officina-header h3 { font-size: 16px; margin: 0; color: #fff; }
    
    .officina-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .officina-select {
      background: #252A2E;
      color: #A1D199;
      border: 1px solid #2A2E33;
      padding: 6px 10px;
      border-radius: 7px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .officina-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #2A2E33;
      background: #252A2E;
      color: #A1D199;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .officina-main { display: flex; flex-direction: column; gap: 10px; padding: 10px; width: 100%; }
    .officina-pane { display: flex; flex-direction: column; width: 100%; }
    .preview-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }

    .editor-wrap {
      display: flex;
      position: relative;
      background: #101214;
      border: 1px solid #2A2E33;
      border-radius: 6px;
      height: 320px;
      overflow: hidden;
      width: 100%;
    }

    .line-numbers {
      width: 40px;
      padding: 10px 5px;
      background: #1C2023;
      color: #566058;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
      user-select: none;
      overflow: hidden;
      border-right: 1px solid #2A2E33;
      flex-shrink: 0;
    }

    .code-container {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
    }

    textarea#code, #highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 10px;
      margin: 0;
      border: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }

    textarea#code {
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: #E8EAE4;
      resize: none;
      outline: none;
      z-index: 2;
    }

    #highlight-layer {
      background: transparent;
      color: #E8EAE4;
      pointer-events: none;
      z-index: 1;
    }

    .hl-keyword { color: #ff79c6; font-weight: bold; }
    .hl-string { color: #f1fa8c; }
    .hl-number { color: #bd93f9; }
    .hl-tag { color: #ff79c6; }
    .hl-attr { color: #50fa7b; }

    iframe#preview {
      width: 100%;
      height: 250px;
      background: #ffffff;
      border: 1px solid #2A2E33;
      border-radius: 6px;
    }

    .editor-wrap.fullscreen,
    iframe#preview.fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      border: none !important;
      border-radius: 0 !important;
      padding-top: 50px !important;
    }

    .esc-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100000;
      background: #ff4d4d;
      color: white;
      padding: 8px 16px;
      border-radius: 5px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .save-section {
      background: #15181A;
      border: 1px solid #2A2E33;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      width: 100%;
    }

    .save-section h4 { margin: 0 0 10px 0; color: #fff; font-size: 15px; }
    .save-input-group { display: flex; gap: 8px; margin-bottom: 12px; }

    .save-input-group input {
      flex: 1;
      background: #101214;
      border: 1px solid #2A2E33;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }

    .btn-save { background: #2e7d32; color: #fff; border: none; }
    .project-list { display: flex; flex-direction: column; gap: 6px; }

    .project-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c2023;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2A2E33;
      word-break: break-all;
    }

    .project-item span { font-size: 13px; color: #A1D199; }
    .project-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-delete { background: #c62828; color: #fff; border: none; }
  </style>
</head>
<body>

  <div id="app-section">
    <div id="my-custom-app">
      <div class="officina-container">
        <div class="officina-header">
          <h3>Officina</h3>
          <div class="officina-controls">
            <select id="langSelect" class="officina-select">
              <option value="html">HTML / CSS / JS</option>
              <option value="python">Python 3</option>
            </select>
            <button type="button" class="officina-btn" id="clearBtn">Pulisci</button>
            <button type="button" class="officina-btn" id="runBtn">Esegui ▶</button>
          </div>
        </div>

        <div class="officina-main">
          <div class="officina-pane">
            <div class="preview-bar">
              <span class="officina-pane-label" id="editorLabel">Codice (html / css / js)</span>
              <button type="button" class="officina-btn" id="expandEditorBtn">Ingrandisci editor ⤢</button>
            </div>
            <div class="editor-wrap" id="editorWrapper">
              <div class="line-numbers" id="lineNumbers">1</div>
              <div class="code-container">
                <pre id="highlight-layer"></pre>
                <textarea id="code" spellcheck="false"></textarea>
              </div>
            </div>
          </div>

          <div class="officina-pane">
            <div class="preview-bar">
              <span class="officina-pane-label">Anteprima / Console</span>
              <button type="button" class="officina-btn" id="expandBtn">Ingrandisci ⤢</button>
            </div>
            <iframe id="preview"></iframe>
          </div>
        </div>
      </div>

      <div class="save-section">
        <h4>I Miei Progetti Salvati</h4>
        <div class="save-input-group">
          <input type="text" id="projectNameInput" placeholder="Nome del progetto...">
          <button type="button" class="officina-btn btn-save" id="saveProjectBtn">📁 Salva Progetto</button>
        </div>
        <div id="projectList" class="project-list"></div>
      </div>
    </div>
  </div>

  <button type="button" id="exitFullscreenBtn" class="esc-btn hidden">Esci ✕</button>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const codeEl = document.getElementById('code');
      const highlightLayer = document.getElementById('highlight-layer');
      const lineNumbersEl = document.getElementById('lineNumbers');
      const editorWrapper = document.getElementById('editorWrapper');
      const preview = document.getElementById('preview');
      const runBtn = document.getElementById('runBtn');
      const clearBtn = document.getElementById('clearBtn');
      const expandBtn = document.getElementById('expandBtn');
      const expandEditorBtn = document.getElementById('expandEditorBtn');
      const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
      const langSelect = document.getElementById('langSelect');
      const editorLabel = document.getElementById('editorLabel');

      const projectNameInput = document.getElementById('projectNameInput');
      const saveProjectBtn = document.getElementById('saveProjectBtn');
      const projectList = document.getElementById('projectList');

      let pyodide = null;
      let isPyodideLoading = false;
      let bufferTimer = null;

      const templates = {
        html: '<!DOCTYPE html>\n<html lang="it">\n<head>\n  <meta charset="UTF-8">\n  <title>Mia App</title>\n</head>\n<body style="color:#000; font-family:sans-serif;">\n  <h1>Ciao Mondo!</h1>\n</body>\n</html>',
        python: '# Esempio Python 3\ndef saluta(nome):\n    print(f"Ciao {nome}! Benvenuto in Officina.")\n\nsaluta("Utente")\nfor i in range(1, 4):\n    print("Conteggio:", i)'
      };

      codeEl.value = templates.html;

      async function initPyodide() {
        if (!pyodide && !isPyodideLoading && window.loadPyodide) {
          isPyodideLoading = true;
          try {
            pyodide = await loadPyodide();
            isPyodideLoading = false;
          } catch(e) { 
            console.error("Errore caricamento Python:", e);
            isPyodideLoading = false;
          }
        }
      }
      initPyodide();

      function updateLineNumbers() {
        if (!codeEl || !lineNumbersEl) return;
        const lines = codeEl.value.split('\n').length;
        let numbers = '';
        for (let i = 1; i <= lines; i++) {
          numbers += i + '\n';
        }
        lineNumbersEl.innerText = numbers;
      }

      function applySyntaxHighlighting() {
        let text = codeEl.value;
        const lang = langSelect.value;

        text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        if (lang === 'html') {
          text = text.replace(/(&lt;\/?[a-zA-Z0-9]+)(\s*.*?&gt;)?/g, function(match, tag, attr) {
            let res = `<span class="hl-tag">${tag}</span>`;
            if (attr) res += attr.replace(/([a-zA-Z-]+)=("[^"]*")/g, '<span class="hl-attr">$1</span>=<span class="hl-string">$2</span>');
            return res;
          });
        } else if (lang === 'python') {
          const keywords = ['def', 'return', 'import', 'from', 'for', 'in', 'while', 'if', 'else', 'elif', 'print', 'class'];
          const kwRegex = new RegExp('\\b(' + keywords.join('|') + ')\\b', 'g');
          text = text.replace(kwRegex, '<span class="hl-keyword">$1</span>');
          text = text.replace(/("[^"]*"|'[^']*')/g, '<span class="hl-string">$1</span>');
          text = text.replace(/\b(\d+)\b/g, '<span class="hl-number">$1</span>');
        }

        highlightLayer.innerHTML = text + '\n';
      }

      codeEl.addEventListener('scroll', () => {
        highlightLayer.scrollTop = codeEl.scrollTop;
        highlightLayer.scrollLeft = codeEl.scrollLeft;
        lineNumbersEl.scrollTop = codeEl.scrollTop;
      });

      codeEl.addEventListener('input', () => {
        updateLineNumbers();
        applySyntaxHighlighting();

        if (langSelect.value === 'html') {
          clearTimeout(bufferTimer);
          bufferTimer = setTimeout(() => {
            executeCode();
          }, 400);
        }
      });

      langSelect.addEventListener('change', () => {
        const selected = langSelect.value;
        editorLabel.innerText = `Codice (${selected})`;
        codeEl.value = templates[selected] || '';
        updateLineNumbers();
        applySyntaxHighlighting();
        resetConsole();
      });

      function resetConsole() {
        const doc = preview.contentDocument || preview.contentWindow.document;
        if (doc) {
          doc.open();
          doc.write("<html><body style='background:#ffffff;color:#000000;font-family:monospace;padding:10px;margin:0;'></body></html>");
          doc.close();
        }
      }

      function appendConsoleOutput(msg, color = '#000000') {
        const doc = preview.contentDocument || preview.contentWindow.document;
        if (doc && doc.body) {
          const div = doc.createElement('div');
          div.style.color = color;
          div.style.whiteSpace = 'pre-wrap';
          div.textContent = msg;
          doc.body.appendChild(div);
        }
      }

      async function executeCode() {
        const lang = langSelect.value;
        const code = codeEl.value;

        if (lang === 'html') {
          preview.srcdoc = code;
        } else if (lang === 'python') {
          resetConsole();
          
          if (!pyodide) {
            appendConsoleOutput("[Caricamento motore Python in corso, attendi e riprova...]", '#b58900');
            await initPyodide();
            if (!pyodide) {
              appendConsoleOutput("[Errore: impossibile caricare Pyodide.]", '#dc322f');
              return;
            }
          }

          try {
            pyodide.setStdout({ batched: (msg) => appendConsoleOutput(msg, '#000000') });
            pyodide.setStderr({ batched: (msg) => appendConsoleOutput(msg, '#dc322f') });
            await pyodide.runPythonAsync(code);
          } catch (err) {
            appendConsoleOutput(`\n[Errore Python]: ${err.message}`, '#dc322f');
          }
        }
      }

      runBtn.addEventListener('click', (e) => {
        e.preventDefault();
        executeCode();
      });

      if (expandBtn && preview) {
        expandBtn.addEventListener('click', (e) => {
          e.preventDefault();
          preview.classList.add('fullscreen');
          exitFullscreenBtn.classList.remove('hidden');
        });
      }

      if (expandEditorBtn && editorWrapper) {
        expandEditorBtn.addEventListener('click', (e) => {
          e.preventDefault();
          editorWrapper.classList.add('fullscreen');
          exitFullscreenBtn.classList.remove('hidden');
        });
      }

      if (exitFullscreenBtn) {
        exitFullscreenBtn.addEventListener('click', (e) => {
          e.preventDefault();
          preview.classList.remove('fullscreen');
          editorWrapper.classList.remove('fullscreen');
          exitFullscreenBtn.classList.add('hidden');
        });
      }

      if (clearBtn && codeEl && preview) {
        clearBtn.addEventListener('click', (e) => {
          e.preventDefault();
          codeEl.value = '';
          resetConsole();
          updateLineNumbers();
          applySyntaxHighlighting();
        });
      }

      function renderProjects() {
        projectList.innerHTML = '';
        let progetti = JSON.parse(localStorage.getItem('miei_progetti_officina') || '{}');

        for (let name in progetti) {
          const item = document.createElement('div');
          item.className = 'project-item';
          item.innerHTML = `
            <span>📁 ${name}</span>
            <div class="project-actions">
              <button type="button" class="officina-btn btn-load" data-name="${name}">Carica</button>
              <button type="button" class="officina-btn btn-delete" data-name="${name}">Elimina</button>
            </div>
          `;
          projectList.appendChild(item);
        }

        document.querySelectorAll('.btn-load').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const name = e.target.getAttribute('data-name');
            let progetti = JSON.parse(localStorage.getItem('miei_progetti_officina') || '{}');
            if (progetti[name] !== undefined) {
              codeEl.value = progetti[name];
              executeCode();
              updateLineNumbers();
              applySyntaxHighlighting();
            }
          });
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const name = e.target.getAttribute('data-name');
            let progetti = JSON.parse(localStorage.getItem('miei_progetti_officina') || '{}');
            delete progetti[name];
            localStorage.setItem('miei_progetti_officina', JSON.stringify(progetti));
            renderProjects();
          });
        });
      }

      if (saveProjectBtn) {
        saveProjectBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const name = projectNameInput.value.trim();
          if (!name) return;

          let progetti = JSON.parse(localStorage.getItem('miei_progetti_officina') || '{}');
          progetti[name] = codeEl.value;
          localStorage.setItem('miei_progetti_officina', JSON.stringify(progetti));

          projectNameInput.value = '';
          renderProjects();
        });
      }

      updateLineNumbers();
      applySyntaxHighlighting();
      resetConsole();
      renderProjects();
    });
  </script>
</body>
</html>
